
name:             OpenNFSRule
query:            api/private/cli/export-policy/rule
object:           open_nfs_rule

counters:
  - ^^policyname                              => policy
  - ^^ruleindex                               => index
  - ^^vserver                                 => svm
  - ^clientmatch                              => clientmatch
  - ^protocol                                 => protocol
  - ^rorule                                   => rorule
  - ^rwrule                                   => rwrule
  - ^superuser                                => superuser
  - filter:
      - clientmatch=0.0.0.0*

export_options:
  instance_keys:
    - index
    - policy
    - svm
  instance_labels:
    - clientmatch
    - protocol
    - rorule
    - rwrule
    - superuser
