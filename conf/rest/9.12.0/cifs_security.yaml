
name:             CIFSSecurity
query:            api/private/cli/cifs
object:           cifs_security

counters:
  - ^^vserver                                 => svm
  - ^auth_style                               => auth_style
  - ^cifs_server                              => cifs_server
  - ^domain                                   => domain
  - ^domain_workgroup                         => domain_workgroup
  - ^organizational_unit                      => organizational_unit
  - ^status_admin                             => status_admin

endpoints:
  - query: api/private/cli/cifs/security
    counters:
      - ^^vserver                             => svm
      - ^is_aes_encryption_enabled            => is_aes_encryption_enabled

  - query: api/protocols/cifs/services
    counters:
      - ^^svm.name                            => svm
      - ^security.session_security            => session_security_for_ad_ldap
      - ^security.smb_encryption             => is_smb_encryption_required
      - ^security.smb_signing                => is_signing_required
      - ^security.use_start_tls              => use_start_tls_for_ad_ldap

export_options:
  instance_keys:
    - svm
  instance_labels:
    - auth_style
    - cifs_server
    - domain
    - domain_workgroup
    - is_aes_encryption_enabled
    - is_smb_encryption_required
    - is_signing_required
    - organizational_unit
    - session_security_for_ad_ldap
    - status_admin
    - use_start_tls_for_ad_ldap
