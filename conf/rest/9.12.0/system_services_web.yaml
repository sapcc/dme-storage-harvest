
name:             SystemServicesWeb
query:            api/private/cli/system/services/web/node
object:           system_services_web

counters:
  - ^^node                                    => node
  - ^external                                 => external_web_services
  - ^http-enabled                             => http_enabled
  - ^http-port                                => http_port
  - ^https-port                               => https_port
  - ^status                                   => web_status

export_options:
  instance_keys:
    - node
  instance_labels:
    - external_web_services
    - http_enabled
    - http_port
    - https_port
    - web_status
