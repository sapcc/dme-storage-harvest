
name:             Security
query:            api/security
object:           security

counters:
  - ^fips.enabled                            => fips_enabled
  - ^management_protocols.rsh_enabled        => rsh_enabled
  - ^management_protocols.telnet_enabled     => telnet_enabled
  - ^tls.cipher_suites                       => tls_ciphers
  - ^tls.protocol_versions                   => tls_versions

export_options:
  instance_keys:
    - fips_enabled
  instance_labels:
    - rsh_enabled
    - telnet_enabled
    - tls_ciphers
    - tls_versions
