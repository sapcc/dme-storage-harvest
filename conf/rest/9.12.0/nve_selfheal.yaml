
name:             NveSelfheal
query:            api/private/cli/volume
object:           nve_selfheal

counters:
  - ^^volume                                  => volume
  - ^^vserver                                 => svm
  - ^is_encrypted                             => is_encrypted
  - ^nodes                                    => nve_selfheal_status
  - ^type                                     => type
  - filter:
      - is_encrypted=!true
      - is_cluster_volume=true
      - junction_path=!/
      - type=RW

export_options:
  instance_keys:
    - svm
    - volume
  instance_labels:
    - is_encrypted
    - nve_selfheal_status
    - type
