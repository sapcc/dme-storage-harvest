
name:             SecurityRole
query:            api/security/roles
object:           security_role

counters:
  - ^^name                                    => role_name
  - ^^owner.name                              => svm

plugins:
  - SecurityRole

export_options:
  instance_keys:
    - command_directory_name
    - role_name
    - svm
  instance_labels:
    - access_level
    - role_query
