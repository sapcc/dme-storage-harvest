
name:                     WebCluster
query:                    api/cluster/web
object:                   web_cluster

counters:
  - ^^state                                 => state
  - ^certificate.name                       => certificate
  - ^client_enabled                         => client_enabled
  - ^csrf.protection_enabled                => csrf_protection_enabled
  - ^csrf.token.concurrent_limit            => csrf_token_concurrent_limit
  - ^csrf.token.idle_timeout                => csrf_token_idle_timeout
  - ^csrf.token.max_timeout                 => csrf_token_max_timeout
  - ^enabled                                => enabled
  - ^hsts.enabled                           => hsts_enabled
  - ^hsts.max_age                           => hsts_max_age
  - ^http_enabled                           => http_enabled
  - ^http_port                              => http_port
  - ^https_port                             => https_port
  - ^ocsp_enabled                           => ocsp_enabled

export_options:
  instance_keys:
    - state
  instance_labels:
    - certificate
    - client_enabled
    - csrf_protection_enabled
    - csrf_token_concurrent_limit
    - csrf_token_idle_timeout
    - csrf_token_max_timeout
    - enabled
    - hsts_enabled
    - hsts_max_age
    - http_enabled
    - http_port
    - https_port
    - ocsp_enabled
