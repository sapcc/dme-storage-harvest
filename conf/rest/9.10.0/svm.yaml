# As private cli api would provide all svms(but system) which we would need for our use-case, So using private api instead of public.

name:                     SVM
query:                    api/private/cli/vserver
object:                   svm

counters:
  - ^^vserver                               => svm
  - ^anti_ransomware_default_volume_state   => anti_ransomware_state
  - ^is_space_enforcement_logical           => is_space_enforcement_logical
  - ^is_space_reporting_logical             => is_space_reporting_logical
  - ^operational_state                      => state
  - ^type                                   => type
  - ^uuid                                   => uuid

endpoints:
  - query: api/svm/svms
    counters:
      - ^^name                              => svm
      - ^nfs.enabled                        => nfs_protocol_enabled
      - ^nsswitch                           => nameservice_switch
  - query: api/security/ssh/svms
    counters:
      - ^^svm.name                          => svm
      - ^ciphers                            => ciphers
  - query: api/protocols/cifs/services
    counters:
      - ^^svm.name                          => svm
      - ^ad_domain.fqdn                     => domain
      - ^ad_domain.organizational_unit      => organizational_unit
      - ^auth_style                         => auth_style
      - ^domain_workgroup                   => domain_workgroup
      - ^enabled                            => cifs_protocol_enabled
      - ^name                               => cifs_server
      - ^security.kdc_encryption            => is_aes_encryption_enabled
      - ^security.session_security          => cifs_ad_ldap_session_security
      - ^security.smb_encryption            => smb_encryption_required
      - ^security.smb_signing               => smb_signing_required
      - ^security.use_ldaps                 => cifs_ad_ldap_use_ldaps
      - ^security.use_start_tls             => use_start_tls_for_ad_ldap
  - query: api/protocols/audit
    counters:
      - ^^svm.name                          => svm
      - ^enabled                            => audit_protocol_enabled
  - query: api/name-services/nis
    counters:
      - ^^svm.name                          => svm
      - ^domain                             => nis_domain
  - query: api/name-services/ldap
    counters:
      - ^^svm.name                          => svm
      - ^session_security                   => ldap_session_security
  - query: api/private/cli/vserver/cifs/server/security
    counters:
      - ^^vserver                           => svm
      - ^lm_compatibility_level             => cifs_ntlm_enabled

plugins:
  - SVM
  - LabelAgent:
      replace:
        - type root_svm `data` `No`
        - type root_svm `node` `Yes`
        - type root_svm `admin` `Yes`
        - type root_svm `system` `Yes`
      replace_regex:
        - audit_protocol_enabled audit_protocol_enabled `^$` `false`      # audit_protocol_enabled is missing in Rest response when audit logs disabled
        - cifs_protocol_enabled cifs_protocol_enabled `^$` `false`      # cifs_protocol_enabled is missing in Rest response when cifs service disabled
      value_to_num:
        - new_status state running running `0`
        - ldap_signed ldap_session_security sign sign `0`
        - ldap_encrypted ldap_session_security seal seal `0`
#  - ChangeLog

export_options:
  instance_keys:
    - svm
  instance_labels:
    - anti_ransomware_state
    - audit_protocol_enabled
    - auth_style
    - cifs_ad_ldap_session_security
    - cifs_ad_ldap_use_ldaps
    - cifs_ntlm_enabled
    - cifs_protocol_enabled
    - cifs_server
    - ciphers
    - domain
    - domain_workgroup
    - fpolicy_enabled
    - fpolicy_name
    - insecured
    - is_aes_encryption_enabled
    - is_space_enforcement_logical
    - is_space_reporting_logical
    - iscsi_authentication_type
    - iscsi_service_enabled
    - ldap_session_security
    - nfs_kerberos_protocol_enabled
    - nfs_protocol_enabled
    - nis_authentication_enabled
    - nis_domain
    - ns_db
    - ns_source
    - organizational_unit
    - root_svm
    - smb_encryption_required
    - smb_signing_required
    - state
    - type
    - use_start_tls_for_ad_ldap

