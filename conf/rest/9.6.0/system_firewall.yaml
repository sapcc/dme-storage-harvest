
name:             SystemFirewall
query:            api/private/cli/system/services/firewall
object:           system_firewall

counters:
  - ^^node                                    => node
  - ^enabled                                  => firewall_status
  - ^logging                                  => logging_enabled

export_options:
  instance_keys:
    - node
  instance_labels:
    - firewall_status
    - logging_enabled
