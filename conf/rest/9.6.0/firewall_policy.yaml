
name:             FirewallPolicy
query:            api/private/cli/system/services/firewall/policy
object:           firewall_policy

counters:
  - ^^policy                                  => policy_name
  - ^^service                                 => service
  - ^^vserver                                 => svm
  - ^allow-list                               => allow_list
  - ^ipspace                                  => ipspace

export_options:
  instance_keys:
    - policy_name
    - service
    - svm
  instance_labels:
    - allow_list
    - ipspace
