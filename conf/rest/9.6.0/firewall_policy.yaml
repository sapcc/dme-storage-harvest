
name:             FirewallPolicy
query:            api/network/firewall/policies
object:           firewall_policy

counters:
  - ^^policy                                  => policy_name
  - ^^service                                 => service
  - ^^vserver                                 => svm
  - ^action                                   => firewall_policy
  - ^fail_policy                              => firewall_fail_policy
  - ^ip_list                                  => ip_list

export_options:
  instance_keys:
    - policy_name
    - service
    - svm
  instance_labels:
    - firewall_fail_policy
    - firewall_policy
    - ip_list
