
name:             FirewallPolicy
query:            api/private/cli/system/services/firewall/policy
object:           firewall_policy

counters:
  - ^^policy                                  => policy_name
  - ^^service                                 => service
  - ^^vserver                                 => svm
  - ^action                                   => firewall_policy
  - ^ip_list                                  => ip_list

export_options:
  instance_keys:
    - policy_name
    - service
    - svm
  instance_labels:
    - firewall_policy
    - ip_list
